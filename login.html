<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Monitor Platnosci — Logowanie</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#f8fafc;display:flex;align-items:center;justify-content:center;min-height:100vh}
.box{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:40px 36px;width:100%;max-width:380px;box-shadow:0 4px 24px rgba(0,0,0,.06)}
.logo{text-align:center;margin-bottom:28px}
.logo h1{font-size:18px;font-weight:700;color:#0f172a;margin-top:8px}
.logo p{font-size:12px;color:#94a3b8;margin-top:4px}
label{display:block;font-size:11px;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
input{width:100%;padding:10px 12px;border:1px solid #e2e8f0;border-radius:8px;font-size:14px;margin-bottom:16px;background:#f8fafc;outline:none}
input:focus{border-color:#3b82f6;background:#fff}
button{width:100%;padding:11px;background:#0f172a;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}
button:hover{background:#334155}
.alert{background:#fde8e8;color:#c0392b;border-radius:8px;padding:10px 14px;font-size:12px;margin-bottom:16px}
</style></head>
<body>
<div class="box">
  <div class="logo">
    <div style="font-size:32px">📊</div>
    <h1>Monitor Platnosci</h1>
    <p>Zaloguj sie, aby kontynuowac</p>
  </div>
  {% with messages = get_flashed_messages() %}
    {% if messages %}
      <div class="alert">{{ messages[0] }}</div>
    {% endif %}
  {% endwith %}
  <form method="POST">
    <label>Login</label>
    <input type="text" name="username" autofocus autocomplete="username" placeholder="Twoj login">
    <label>Haslo</label>
    <input type="password" name="password" autocomplete="current-password" placeholder="••••••••">
    <button type="submit">Zaloguj sie</button>
  </form>
</div>
</body></html>
